{% extends "base.html" %}
{% block title %}Register product{% endblock %}

{% block content %}
<header class="page-header">
  <h1>Register a product</h1>
  <p class="page-header__sub">This creates the product record and generates its QR code identifier.</p>
</header>

<section class="panel panel--form">
  <form method="POST" action="{{ url_for('register') }}" id="register-form">

    <div class="form-grid">
      <label class="field">
        <span class="field__label">Medicine name *</span>
        <input type="text" name="name" value="{{ form.get('name', '') }}" required>
      </label>

      <label class="field">
        <span class="field__label">Generic name</span>
        <input type="text" name="generic_name" value="{{ form.get('generic_name', '') }}">
      </label>

      <label class="field">
        <span class="field__label">Batch number *</span>
        <input type="text" name="batch_number" value="{{ form.get('batch_number', '') }}" required>
      </label>

      <label class="field">
        <span class="field__label">Manufacturer *</span>
        <input type="text" name="manufacturer_name" value="{{ form.get('manufacturer_name', '') }}" required>
      </label>

      <label class="field">
        <span class="field__label">Manufacture date *</span>
        <input type="date" name="manufacture_date" value="{{ form.get('manufacture_date', '') }}" required>
      </label>

      <label class="field">
        <span class="field__label">Expiry date *</span>
        <input type="date" name="expiry_date" value="{{ form.get('expiry_date', '') }}" required>
      </label>

      <label class="field">
        <span class="field__label">Quantity *</span>
        <input type="number" name="quantity" min="1" value="{{ form.get('quantity', '') }}" required>
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="button">Register product</button>
    </div>
  </form>
</section>
{% endblock %}
